# Phones never connect to these ports directly.
# Caddy publishes only 443, and it forwards MQTT-over-WebSocket to port 9001.
# The recorder uses port 1883 inside the Docker network.

persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 14d
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
user mosquitto

listener 1883
protocol mqtt

listener 9001
protocol websockets
